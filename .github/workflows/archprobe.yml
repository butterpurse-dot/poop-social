name: ArchProbe
on:
  push:
    branches: [main]
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - run: echo a
  archive:
    name: Archive (Xcode 26)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: a
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Upload to App Store Connect
        if: ${{ secrets.ASC_KEY_ID != '' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: echo upload
