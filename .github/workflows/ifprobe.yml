name: IfProbe
on:
  push:
    branches: [main]
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - run: echo a
  b:
    name: Archive
    if: startsWith(github.ref, 'refs/tags/v')
    needs: a
    runs-on: ubuntu-latest
    steps:
      - name: Upload
        if: ${{ secrets.NOPE_KEY != '' }}
        run: echo upload
