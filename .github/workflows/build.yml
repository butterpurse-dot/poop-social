name: iOS

# Why this workflow exists
# ------------------------
# The project is developed on an Intel iMac capped at Xcode 15.2. Since April
# 2026, App Store Connect requires uploads to be built with Xcode 26 or later,
# so the *local* Mac can build and run the app but cannot produce a shippable
# binary. This workflow does the shippable build on GitHub's macOS runners,
# which ship Xcode 26.
#
# Note the SDK requirement is about the toolchain, NOT the supported OS range.
# The app still targets iOS 17, so people on older, un-updated iPhones are
# unaffected. Deployment target and build SDK are separate settings.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & test (Xcode 26) — ${{ matrix.device == '' && 'newest iPhone' || matrix.device }}
    # macos-26 is arm64 and ships Xcode 26.x with the iOS 26 SDK, which is
    # what App Store Connect accepts. macos-latest may still point at an
    # older image, so pin explicitly rather than trust the alias.
    runs-on: macos-26
    timeout-minutes: 60

    strategy:
      # Don't kill the other simulators when one fails -- a failure on, say,
      # the smallest iPhone is more useful next to a pass on the largest.
      fail-fast: false
      matrix:
        # Device-name fragments, resolved at runtime against whatever the
        # runner image actually has. Naming a *fragment* rather than a full
        # "iPhone 17 Pro" means this keeps working when Apple renames the
        # lineup, and the picker already handles "no such device" by failing
        # loudly instead of silently testing something else.
        device:
          - ""              # newest iPhone on the newest iOS runtime
          - "iPhone 17 Pro"
          - "iPhone SE"     # smallest screen: layout + Dynamic Type extremes
          - "iPad"          # regular size class: the layouts must not break

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          echo "--- available devices ---"
          xcrun simctl list devices available | head -30

      - name: Pick a simulator
        id: sim
        env:
          # Empty string for the first matrix leg means "newest iPhone".
          WANT_DEVICE: ${{ matrix.device }}
        run: |
          # Choose the newest available iPhone at runtime instead of hardcoding
          # a model that may not exist on a future runner image.
          #
          # The Python is written to a file rather than passed as `python3 -c
          # "..."`: the inline form needs quoting that survives a YAML block,
          # a shell string, and Python's own string literals at once, which is
          # three levels of escaping and is exactly what broke this workflow
          # before. A file has none of that.
          cat > pick_sim.py <<'PY'
          import json, re, sys, os

          devices = json.load(sys.stdin)["devices"]
          want_device = os.environ.get("WANT_DEVICE", "")

          def ios_version(runtime):
              """Sort key from a runtime id like
              com.apple.CoreSimulator.SimRuntime.iOS-26-4 -> (26, 4).

              Parsed numerically, not compared as a string: a string sort puts
              iOS-26-10 *below* iOS-26-4, so the day a 26.10 runtime appears the
              picker would silently select an older simulator.
              """
              m = re.search(r"iOS-(\d+)(?:-(\d+))?", runtime)
              if not m:
                  return None
              major = int(m.group(1))
              minor = int(m.group(2) or 0)
              return (major, minor)

          candidates = []
          for runtime, devs in devices.items():
              version = ios_version(runtime)
              if version is None:
                  continue
              for dev in devs:
                  if not dev.get("isAvailable"):
                      continue
                  if "iPhone" not in dev["name"]:
                      continue
                  if want_device and want_device not in dev["name"]:
                      continue
                  candidates.append((version, dev["name"], dev["udid"], runtime))

          if not candidates:
              sys.exit(f"no iPhone simulator found (WANT_DEVICE={want_device!r})")

          # Newest OS first; ties broken by device name so the choice is stable
          # rather than dict-order dependent.
          candidates.sort(key=lambda c: (c[0], c[1]))
          version, name, udid, runtime = candidates[-1]
          print(udid)
          print(f"picked {name} on iOS {version[0]}.{version[1]} ({runtime})",
                file=sys.stderr)
          PY

          UDID=$(xcrun simctl list devices available -j | python3 pick_sim.py)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $UDID"

      - name: Build
        run: |
          # `set -o pipefail` so a build failure inside the pipe still fails the
          # step, and an explicit fallback only for the case where the pretty
          # printer is genuinely missing.
          #
          # The earlier form (`... | xcbeautify || xcodebuild ...`) was wrong in
          # two ways: a *build* failure looked identical to a missing
          # `xcbeautify`, so it silently re-ran the build and reported the
          # second result; and the retry ran without pipefail. Checking for the
          # tool up front separates those cases cleanly.
          set -o pipefail

          if command -v xcbeautify >/dev/null 2>&1; then
            xcodebuild build \
              -project PoopSocial.xcodeproj \
              -scheme PoopSocial \
              -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
              -derivedDataPath build \
              | xcbeautify
          else
            xcodebuild build \
              -project PoopSocial.xcodeproj \
              -scheme PoopSocial \
              -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
              -derivedDataPath build
          fi

      - name: Test
        run: |
          # Boot and warm the simulator first.
          #
          # Without this, the UI tests intermittently died with launch and
          # terminate timeouts:
          #
          #   Failed to terminate com.poopsocial.app:5016
          #   Timed out while launching application via Xcode
          #
          # Which test failed was random (a different one each attempt), and
          # the same tests passed when the simulator happened to be warm, so
          # this is the runner not the tests. Booting explicitly, and opening
          # Simulator.app so the UI session is actually up, removes the race.
          SIM="${{ steps.sim.outputs.udid }}"
          xcrun simctl boot "$SIM" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM" -b || true
          open -a "$(xcode-select -p)/Applications/Simulator.app" || true

          # Give the SpringBoard a moment to settle after boot; launching
          # straight into a test run while the simulator is still starting is
          # exactly the window that timed out above.
          for _ in $(seq 1 30); do
            xcrun simctl spawn "$SIM" launchctl list >/dev/null 2>&1 && break
            sleep 2
          done

          # -parallel-testing-enabled NO is deliberate: the suites are not
          # parallel-safe (they drive a shared simulator UI), and cloned
          # devices have been unreliable. See README.
          #
          # -retry-tests-on-failure gives a genuinely flaky UI test one more
          # chance without hiding a real failure: a test that only passes on
          # retry is still reported, so it cannot mask a regression the way a
          # blanket retry of the job would.
          xcodebuild test \
            -project PoopSocial.xcodeproj \
            -scheme PoopSocial \
            -destination "platform=iOS Simulator,id=$SIM" \
            -derivedDataPath build \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure \
            -test-iterations 2

  # Archive + upload happen only on a tag, and only once the Apple Developer
  # account and App Store Connect API key are configured as repository secrets.
  # Kept as a separate job so a missing secret can never fail normal CI.
  archive:
    name: Archive (Xcode 26)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Archive
        run: |
          xcodebuild archive \
            -project PoopSocial.xcodeproj \
            -scheme PoopSocial \
            -destination "generic/platform=iOS" \
            -archivePath build/PoopSocial.xcarchive \
            -allowProvisioningUpdates

      - name: Export .ipa
        run: |
          cat > ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/PoopSocial.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates

      - name: Upload to App Store Connect
        # Needs three repo secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8
        # (the .p8 contents). Skipped when absent, so the job is harmless
        # before the Apple Developer account exists.
        #
        # The `if:` tests the env var, NOT the secret. `secrets` is not an
        # available named-value in a step condition, and referencing it there
        # does not fail gracefully -- the workflow is rejected outright at
        # validation:
        #
        #   Unrecognized named-value: 'secrets'.
        #   Located at position 1 within expression: secrets.ASC_KEY_ID != ''
        #
        # That rejection is what produced runs with zero jobs, no log, and the
        # unhelpful "This run likely failed because of a workflow file issue"
        # summary. `env` *is* in scope for `if:`, so the secret is mapped first
        # and the condition reads the mapped value.
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        if: ${{ env.ASC_KEY_ID != '' }}
        run: |
          KEY_PATH="$RUNNER_TEMP/asc_key.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY_PATH"
          xcrun altool --upload-app \
            --type ios \
            --file build/export/PoopSocial.ipa \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
